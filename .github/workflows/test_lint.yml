name: Run tests
permissions:
  contents: read

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      rt:
        # https://github.com/python-rt/docker-rt; the steps start when RT is ready (health check of the image)
        image: ghcr.io/python-rt/request-tracker:6.0
        ports:
          - 8080:8080

    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python3 -m pip install uv
          uv sync --group test

      - name: Prepare RT
        # REST2 can not create authentication tokens or apply custom fields to queues, see tests/rt_initdata.pl
        run: |
          docker exec -i "${{ job.services.rt.id }}" rt-initdata - < tests/rt_initdata.pl
          token=$(docker exec "${{ job.services.rt.id }}" rt-token --description 'python-rt tests')
          test -n "$token"
          echo "::add-mask::$token"
          echo "RT_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Test with pytest
        run: |
          uv run pytest -v -m '' tests


  coverage:
    name: Combine & check coverage.
    runs-on: ubuntu-latest

    services:
      rt:
        # https://github.com/python-rt/docker-rt; the steps start when RT is ready (health check of the image)
        image: ghcr.io/python-rt/request-tracker:6.0
        ports:
          - 8080:8080

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python3 -m pip install uv
          uv sync --group test
          uv pip install coverage[toml]

      - name: Prepare RT
        # REST2 can not create authentication tokens or apply custom fields to queues, see tests/rt_initdata.pl
        run: |
          docker exec -i "${{ job.services.rt.id }}" rt-initdata - < tests/rt_initdata.pl
          token=$(docker exec "${{ job.services.rt.id }}" rt-token --description 'python-rt tests')
          test -n "$token"
          echo "::add-mask::$token"
          echo "RT_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Generate coverage data
        run: |
          uv run coverage run --omit tests --parallel-mode -m pytest -m '' tests

      - name: Combine coverage & create xml report
        run: |
          uv run coverage combine
          uv run coverage xml

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: true
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}


  lint_python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - run: |
          python3 -m pip install uv
          uv sync --group dev

      - name: Generated sync code and tests are up to date with the async ones
        run: uv run unasyncd

      - name: mypy
        # checks the files configured in pyproject.toml: the library and the tests
        run: uv run mypy --config-file pyproject.toml

      - name: bandit
        run: uv run bandit -r rt

      - name: codespell
        run: uv run codespell --ignore-words=.codespell_ignore rt

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - run: |
          python3 -m pip install uv
          uv sync --group docs

      - name: Build the documentation, warnings (e.g. broken references in docstrings) are errors
        run: uv run sphinx-build -W --keep-going -b html doc doc/_build/html
