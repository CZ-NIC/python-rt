[build-system]
requires = ["hatchling>=1.27", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "rt"
description = "Python interface to Request Tracker API"
readme = "README.rst"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Georges Toth", email = "georges.toth@govcert.etat.lu" }]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Operating System :: POSIX",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Framework :: AsyncIO",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
requires-python = ">= 3.11"
dependencies = [
  "httpx2~=2.7",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/python-rt/python-rt"
Documentation = "https://python-rt.readthedocs.io/"
Source = "https://github.com/python-rt/python-rt"
Tracker = "https://github.com/python-rt/python-rt/issues"
Changelog = "https://github.com/python-rt/python-rt/blob/master/CHANGELOG.md"

[dependency-groups]
docs = [
  "sphinx",
  "sphinx-autodoc-typehints",
  "sphinx-rtd-theme",
  "furo",
  "sphinx-copybutton",
]
dev = [
  "mypy",
  "ruff",
  "codespell",
  "bandit",
  "prek>=0.3.2",
  "unasyncd~=0.10",
  "pytest-cov>=7.1.0",
]
test = [
  "pytest~=9.1",
  "pytest-asyncio~=1.4",
  "pytest-xdist~=3.8",
  "coverage~=7.6",
  "typeguard>=4.6.0",
]

[tool.hatch.envs.default]
installer = "uv"

[tool.hatch.build.targets.sdist]
include = [
  "/rt",
  "/tests",
]
exclude = []

[tool.hatch.version]
source = "vcs"

[tool.unasyncd]
# rt/rest2.py and the sync REST2 tests are generated from the async ones, do not edit them manually.
# Run `uv run unasyncd` to regenerate them; it exits with 1 if a generated file was out of date.
files = { "rt/rest2_async.py" = "rt/rest2.py", "rt/_rest2_async/__init__.py" = "rt/_rest2/__init__.py", "rt/_rest2_async/transport.py" = "rt/_rest2/transport.py", "rt/_rest2_async/tickets.py" = "rt/_rest2/tickets.py", "rt/_rest2_async/users.py" = "rt/_rest2/users.py", "rt/_rest2_async/groups.py" = "rt/_rest2/groups.py", "rt/_rest2_async/queues.py" = "rt/_rest2/queues.py", "rt/_rest2_async/assets.py" = "rt/_rest2/assets.py", "rt/_rest2_async/articles.py" = "rt/_rest2/articles.py", "rt/_rest2_async/custom_fields.py" = "rt/_rest2/custom_fields.py", "rt/_rest2_async/rights.py" = "rt/_rest2/rights.py", "tests/test_basic_async.py" = "tests/test_basic.py", "tests/test_tickets_async.py" = "tests/test_tickets.py", "tests/test_rest2_fixes_async.py" = "tests/test_rest2_fixes.py", "tests/test_rest2_admin_async.py" = "tests/test_rest2_admin.py", "tests/test_rest2_messages_async.py" = "tests/test_rest2_messages.py" }
add_replacements = { "AsyncRt" = "Rt", "rt._rest2_async.transport._AsyncTransport" = "rt._rest2.transport._Transport", "rt._rest2_async.tickets.AsyncTickets" = "rt._rest2.tickets.Tickets", "rt._rest2_async.users.AsyncUsers" = "rt._rest2.users.Users", "rt._rest2_async.groups.AsyncGroups" = "rt._rest2.groups.Groups", "rt._rest2_async.queues.AsyncQueues" = "rt._rest2.queues.Queues", "rt._rest2_async.assets.AsyncAssets" = "rt._rest2.assets.Assets", "rt._rest2_async.assets.AsyncCatalogs" = "rt._rest2.assets.Catalogs", "rt._rest2_async.articles.AsyncArticles" = "rt._rest2.articles.Articles", "rt._rest2_async.articles.AsyncClasses" = "rt._rest2.articles.Classes", "rt._rest2_async.custom_fields.AsyncCustomFields" = "rt._rest2.custom_fields.CustomFields", "rt._rest2_async.custom_fields.AsyncCustomRoles" = "rt._rest2.custom_fields.CustomRoles", "rt._rest2_async.rights.AsyncRights" = "rt._rest2.rights.Rights", "_AsyncTransport" = "_Transport", "AsyncTickets" = "Tickets", "AsyncUsers" = "Users", "AsyncGroups" = "Groups", "AsyncQueues" = "Queues", "AsyncAssets" = "Assets", "AsyncCatalogs" = "Catalogs", "AsyncArticles" = "Articles", "AsyncClasses" = "Classes", "AsyncCustomFields" = "CustomFields", "AsyncCustomRoles" = "CustomRoles", "AsyncRights" = "Rights", "httpx2.AsyncClient" = "httpx2.Client", "aclose" = "close" }
add_editors_note = true
transform_docstrings = true
# removes the imports of the async modules which are left in the generated tests
ruff_fix = true
ruff_format = true
# Always regenerate: without it, unasyncd only detects changes of the source file, not manual edits of rt/rest2.py.
force_regen = true
cache = false

[tool.unasyncd.per_file_add_replacements."tests/test_basic_async.py"]
"rt.rest2_async.AsyncRt" = "rt.rest2.Rt"
"async_rt_connection" = "rt_connection"

[tool.unasyncd.per_file_add_replacements."tests/test_tickets_async.py"]
"rt.rest2_async.AsyncRt" = "rt.rest2.Rt"
"async_rt_connection" = "rt_connection"

[tool.unasyncd.per_file_add_replacements."tests/test_rest2_fixes_async.py"]
"rt.rest2_async.AsyncRt" = "rt.rest2.Rt"
"async_rt_connection" = "rt_connection"

[tool.unasyncd.per_file_add_replacements."tests/test_rest2_admin_async.py"]
"rt.rest2_async.AsyncRt" = "rt.rest2.Rt"
"async_rt_connection" = "rt_connection"

[tool.unasyncd.per_file_add_replacements."tests/test_rest2_messages_async.py"]
"rt.rest2_async.AsyncRt" = "rt.rest2.Rt"
"async_rt_connection" = "rt_connection"

[tool.mypy]
strict = true
show_error_codes = true
show_error_context = true
show_column_numbers = true
ignore_missing_imports = true
warn_no_return = true

files = [
  "rt/**/*.py",
  "tests/**/*.py",
]

[[tool.mypy.overrides]]
# tests are checked, but need no complete type annotations
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_any_generics = false
warn_return_any = false

[[tool.mypy.overrides]]
# the REST1 tests are an old unittest suite without type annotations
module = "tests.test_rest1"
ignore_errors = true

[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = [
  "tests"
]
# The sync tests are generated from the async tests (see [tool.unasyncd]) and only run with `pytest -m sync` or
# `pytest -m ""` (all tests). The tests run in 4 parallel processes (pytest-xdist), use `-n 0` to debug them.
addopts = "-m 'not sync' -n 4"
markers = [
  "sync: tests of the sync REST2 client, generated from the async tests (not run by default)",
  "live: tests which need a running RT (all others, e.g. with mocked responses, run in seconds: pytest -m 'not live')",
]

[tool.ruff]
line-length = 160
indent-width = 4
target-version = "py311"
include = [
  "pyproject.toml",
  "rt/**/*.py",
  "tests/**/*.py"
]

[tool.ruff.lint]
select = [
  "E", # pycodestyle errors
  "W", # pycodestyle warnings
  "F", # pyflakes
  "I", # isort
  "C", # flake8-comprehensions
  "B", # flake8-bugbear
  "D", # pydocstyle
  "N", # pep8-naming
  "UP", # pyupgrade
  "YTT", # flake8-2020
  "ANN", # flake8-annotations
  "ASYNC", # flake8-async
  "S", # flake8-bandit
  "BLE", # flake8-blind-except
  "B", # flake8-bugbear
  "A", # flake8-builtins
  "COM", # flake8-commas
  "C4", # flake8-comprehensions
  "DTZ", # flake8-datetimez
  "EM103", # flake8-errmsg - dot-format-in-exception
  "EXE", # flake8-executable
  "ISC", # flake8-implicit-str-concat
  "ICN", # flake8-import-conventions
  "G", # flake8-logging-format
  "INP", # flake8-no-pep420
  "PIE", # flake8-pie
  "T20", # flake8-print
  "PYI", # flake8-pyi
  "RSE", # flake8-raise
  "RET", # flake8-return
  "SLF", # flake8-self
  "SLOT", # flake8-slots
  #    "SIM",  # flake8-simplify
  "TID", # flake8-tidy-imports
  "TCH", # flake8-type-checking
  "PTH", # flake8-use-pathlib
  "TD", # flake8-todos
  "FIX", # flake8-fixme
  "ERA", # eradicate
  "PL", # Pylint
  "PLC", # Convention
  "PLE", # Error
  "PLR", # Refactor
  "PLW", # Warning
  "B904", # reraise-no-cause
  "FLY", # flynt
  #    "PERF",  # Perflint
  "RUF013", # implicit-optional
]
unfixable = [
  'ERA001',
  'T201', # `print` found
]
extend-select = ['Q', 'RUF100', 'C90']
flake8-quotes = { inline-quotes = 'single', multiline-quotes = 'single' }
ignore = [
  "C901", # too complex
  "E501", # line too long
  "B008", # do not perform function call in argument defaults
  "ANN401", # any-type
  "ANN002", # missing-type-args
  "ANN003", # missing-type-kwargs
  "PLR0913", # Too many arguments to function call
  "PLR0915", # Too many statements
  "PLR2004", # Magic value used in comparison
  "PLW0603", # Using the global statement
  "PLR0912", # Too many branches
  "COM812", #	missing-trailing-comma
  "ISC001", # single-line-implicit-string-concatenation
  "Q001", # bad-quotes-multiline-string
  "RET504", # Unnecessary assignment before `return` statement
  "D401", # First line of docstring should be in imperative mood
  "D205", # 1 blank line required between summary line and description
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "ANN", # Missing return type annotation
  "D", # Missing docstring
  "ERA001", # Found commented-out code
]
"rt/rest1.py" = [
  "N803", # Argument name should be lowercase
]
# generated from the files in rt/_rest2_async/, where `yield from` is not available
"rt/_rest2/*.py" = [
  "UP028", # yield-in-for-loop
]
# generated from the corresponding *_async.py files, where `[item async for item in ...]` can not be replaced by list()
"tests/test_basic.py" = ["C416"]
"tests/test_tickets.py" = ["C416"]
"tests/test_rest2_fixes.py" = ["C416"]
"tests/test_rest2_admin.py" = ["C416"]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint.pydocstyle]
convention = "numpy"
